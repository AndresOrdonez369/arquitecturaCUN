<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Atkinson+Hyperlegible+Next:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/deck.css">
<title>Slides · Arquitectura de Videojuegos</title>
</head>
<body class="deck" data-page="deck">
<main class="stage" id="stage"></main>
<div class="prog" id="prog"></div>
<aside class="notes" id="notes"></aside>
<div class="deckbar">
  <a id="back" href="index.html" title="Volver a la clase"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span class="hidem">Clase</span></a>
  <span class="kind" id="kind"></span>
  <span class="ttl" id="ttl"></span>
  <span class="pasos" id="pasos" aria-hidden="true"></span>
  <span class="cnt" id="cnt"></span>
  <button id="nbtn" title="Notas del docente (N)" aria-label="Notas del docente"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H10l-5 4z"/></svg></button>
  <button id="full" class="hidem" title="Pantalla completa (F)" aria-label="Pantalla completa"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="prev" title="Anterior" aria-label="Slide anterior"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <button id="next" title="Siguiente" aria-label="Slide siguiente"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
<script src="data/curso.js"></script>
<script src="assets/fig.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
